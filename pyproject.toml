[project]
name = "madrid-air-quality-pipeline"
version = "0.1.0"
description = "End-to-end ELT pipeline for Madrid air quality and weather data, orchestrated with Airflow, modeled with dbt and stored in DuckDB."
readme = "README.md"
authors = [
    { name = "Daniel Dominguez", email = "danieldomingueztrejo@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "requests>=2.34.2",
]

[project.scripts]
madrid-air-quality-pipeline = "madrid_air_quality_pipeline:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dashboard = [
    "folium>=0.20.0",
    "pandas>=3.1.0",
    "plotly>=7.1.0",
    "quarto-cli>=1.11.9",
]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
transform = [
    "dbt-core>=1.12,<2",
    "dbt-duckdb>=1.11.1,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
default-groups = ["dev", "transform","dashboard"]
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: import order, UP: modern Python syntax, B: likely bugs
select = ["E", "W", "F", "I", "UP", "B"]
# Line length is left to the formatter; long strings and URLs are not split.
ignore = ["E501"]
