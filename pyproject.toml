[project]
name = "madrid-air-quality-pipeline"
version = "0.1.0"
description = "End-to-end ELT pipeline for Madrid air quality and weather data, orchestrated with Airflow, modeled with dbt and stored in DuckDB."
readme = "README.md"
authors = [
    { name = "Daniel Dominguez", email = "danieldomingueztrejo@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "requests>=2.34.2",
]

[project.scripts]
madrid-air-quality-pipeline = "madrid_air_quality_pipeline:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
