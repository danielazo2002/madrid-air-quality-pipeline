models:
  - name: fct_air_quality_weather
    description: Hourly pollutant concentration per station, joined with the weather at the same station and hour.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [station_id, pollutant_code, measured_at_utc]
    columns:
      - name: measured_at_utc
        description: End of the measurement hour, UTC (decision 008).
        data_tests: [not_null]
      - name: unit
        data_tests: [not_null]